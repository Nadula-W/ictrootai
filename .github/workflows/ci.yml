name: ICTRoot checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ictroot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ictroot_test
          POSTGRES_PASSWORD: disposable_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ictroot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:disposable_ci_only@127.0.0.1:5432/ictroot_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:disposable_ci_only@127.0.0.1:5432/ictroot_test
      DATABASE_TRANSPORT: direct
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - name: Prepare disposable Supabase-compatible roles
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://postgres:disposable_ci_only@127.0.0.1:5432/ictroot_test') as connection:
              connection.execute('CREATE ROLE anon')
              connection.execute('CREATE ROLE authenticated')
          PY
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m app.curriculum_catalogue
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Start production frontend for mocked browser checks
        run: |
          npm run start > /tmp/ictroot-next.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ictroot-next.log
          exit 1
      - name: Check curriculum, assessment, practice and save flows
        run: npx playwright test --grep-invert "student resumes an assessment|teacher creates class and assigned assessment|administrator sees real AI status|mobile sign in remains readable"
